# Projects for both the website and the CV: index.md renders each group under
# its own heading, and cv/cv.typ lists every group in one section, in file order.
#
# Per entry:
#   show: [web, cv]                where the entry appears (default: [web])
#   title, subtitle                website headings
#   short_title, short_subtitle    CV headings (default: title, subtitle);
#                                  short_subtitle: "" leaves it off the CV
#   date                           "Feb 2026 – Present", shared by both
#   bullets                        each has a long (website, Markdown) and/or a
#                                  short (CV, plain text) version; leave one out
#                                  to keep that bullet off that output
#   links                          pills next to the website title; on the CV,
#                                  each short_label (default: label) follows the
#                                  subtitle
#   tags, image, summary           website only (image: thumbnail, e.g. assets/img/foo.png)
#
# CV bullets follow "achieved X, measured by Y, by doing Z": lead with an action
# verb, quantify the result, one line each, at most 3 per project. CV headings
# don't say a project was coursework, except the thesis and capstone.

