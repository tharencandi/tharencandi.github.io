  - title: "The Limits of Cross-Lingual Transfer: Evaluating SignCLIP on Italian Sign Language (LIS)"
    short_title: "The Limits of Cross-Lingual Transfer: SignCLIP on LIS"
    show: [web, cv]
    subtitle: Research
    date: Feb 2026 – Jun 2026
    links:
      - label: Project page
        url: https://tharencandi.net/signclip-lis-experiments/
        short_label: Paper
      - label: GitHub
        url: https://github.com/tharencandi/signclip-lis-experiments
    bullets:
      # On the website this result is part of the ablation bullet below.
      - short: Matched SOTA on A3LIS-147 with a fine-tuned linear probe (R@1 80.2%).
      - long: First study of SignCLIP's multilingual transfer to low-resource LIS, testing the iconicity hypothesis across zero-shot, few-shot and fine-tuning, on the A3LIS-147 and SignIT datasets
        short: "First SignCLIP study on Italian Sign Language: zero-shot transfer helps iconic signs, hurts non-iconic ones."
      - long: "Showed that aligning many sign languages to one English text space causes negative zero-shot transfer: it helps iconic signs and hurts non-iconic ones"
      - long: Ran a fine-tuning ablation over six contrastive objectives (InfoNCE, SupCon, GlobalNCE, DHN-NCE, ProLIP, cross-entropy). GlobalNCE raised zero-shot R@1 from 3.7% to 76.2%, and its linear probe (R@1 80.2%) matches the previous state of the art on A3LIS-147
        short: "Ablated six contrastive losses: GlobalNCE fine-tuning raised zero-shot R@1 from 3.7% to 76.2%."
      - long: On SignIT, outperformed all of the original authors' non-video baselines using pose keypoints only
    tags: [Python, PyTorch, fairseq, MediaPipe Holistic, scikit-learn]

  - title: Universal Sign Language Representations for ISLR
    short_title: Universal Sign Language Representation Learning
    show: [web, cv]
    subtitle: Independent Research
    date: Aug 2026 – Present
    bullets:
      - long: Exploring multilingual, language-universal sign representations, motivated by the negative cross-lingual transfer found in the SignCLIP study
        short: Targeting the negative cross-lingual transfer found in SignCLIP with language-universal sign embeddings.
      - long: Developing a pose-based architecture, inspired by multimodal JEPA, that learns language-gated sign embeddings by predicting into a frozen text-embedding space, so representations carry semantic meaning across sign languages
        short: Designing a language-gated, JEPA-inspired pose model that predicts into a frozen text-embedding space.
      - long: "Early results (ongoing): above-random positive transfer to sign languages the model has never seen"
        short: Early results show above-random transfer to sign languages unseen in training (ongoing).
    tags: [Python, PyTorch, MediaPipe]

  - title: Automatic Extraction of Anatomical Landmarks of Pinna Shape
    short_title: 3D Pinna Landmark Extraction
    show: [web, cv]
    subtitle: Huawei Munich Tech Arena 2026 · Team GoMuDada
    short_subtitle: Huawei Munich Tech Arena
    date: Aug 2026 – Sep 2026
    bullets:
      - long: Built a pipeline that predicts 85 anatomical ear landmarks from 3D head scans, for personalised spatial audio (HRTF)
        short: Predicted 85 ear landmarks from 3D head scans at ~1.2 mm mean error, for personalised spatial audio.
      - long: Ranked 12th of 38 teams (top third) on the public leaderboard as an all-Master's team, in a challenge that recommended PhD members
        short: Ranked 12th of 38 teams (top third) as an all-Master's team in a challenge that recommended PhD members.
      - long: "Split the task in two: predict 15 anchor landmarks, then trace the remaining 70 contour points between them, reaching ~1.2 mm mean error overall"
      - long: "Anchors: fused three different networks (multi-hypothesis DGCNN, HRNet heatmaps on rendered depth/curvature images, Point2SSM++) with per-landmark agreement weighting, deployed as cross-validated ensembles"
        short: Ensembled DGCNN, HRNet and Point2SSM++ for 15 anchors; traced 70 contour points as shape-guided geodesics.
      - long: "Contours: traced as geodesic (shortest) paths on the mesh, steered by a statistical shape model prior so they follow the ear's folds (0.63 mm ceiling), then refined with a graph-attention network"
      - long: Generated synthetic training ears via PCA shape sampling and RBF mesh warping, cutting anchor error by 4%
    tags: [Python, PyTorch, NumPy, SciPy, scikit-learn, trimesh, Point-cloud deep learning]

  - title: Multimodal Speech Emotion Recognition on RAVDESS
    short_title: Multimodal Speech Emotion Recognition
    show: [web, cv]
    subtitle: Master's Course Project · Speech Processing
    short_subtitle: ""
    date: Jun 2026 – Jul 2026
    links:
      - label: Project page
        url: https://tharencandi.net/fer-ser-fusion/
        short_label: Paper
      - label: GitHub
        url: https://github.com/tharencandi/fer-ser-fusion
    bullets:
      - long: Built an audio-visual system that classifies 7 emotions from short RAVDESS speech video clips, combining speech emotion recognition (SER) on self-supervised speech representations with facial emotion recognition (FER)
        short: Fused speech (wav2vec 2.0) and facial (MediaPipe + XGBoost) models for 7-class emotion recognition.
      - long: "Temperature-scaled late fusion of the two branches improved accuracy by 11–18 points (best: 86.7%)"
        short: "Temperature-scaled late fusion improved accuracy by 11–18 points (best: 86.7%)."
      - long: "Built the FER branch as an XGBoost random forest (XGBoostRF) on MediaPipe facial blendshapes: a 376-dimensional summary vector of 7 per-channel descriptors over 53 blendshape channels (the 52 ARKit blendshapes plus MediaPipe's _neutral score), plus 5 inter-group ratios"
      - long: "Compared three speech models on the same actor-disjoint split: a frozen wav2vec 2.0 probe, LoRA-adapted wav2vec 2.0, and a frozen emotion2vec probe"
      - long: "Found that a general speech model (wav2vec 2.0) beats one pretrained specifically for emotion (emotion2vec): 72.5% vs 68.3%"
        short: "Showed a general speech model (wav2vec 2.0) beats an emotion-specific one (emotion2vec): 72.5% vs 68.3%."
      - long: LoRA beat the frozen probe slightly on its own (72.5% vs 71.3%) and clearly after fusion (86.7% vs 82.1%)
      - long: "The face model is strongest where speech is weakest: happy (100% recall vs 38% for LoRA wav2vec 2.0) and sad (84% vs 50%)"
    tags: [Python, PyTorch, Hugging Face, PEFT/LoRA, MediaPipe, XGBoost]

  - title: Evaluating Dynamic Object Removal and Scene Stabilisation Strategies for Multi-View Consistent Video
    short_title: Dynamic Object Removal for 3D Reconstruction of Generated Video
    show: [web]
    subtitle: Master's Course Project · Advanced Topics in Data Science, taught by Iro Armeni (Stanford) and Lamberto Ballan · with Nicole Mietto
    date: "2026"
    links:
      - label: Project page
        url: https://tharencandi.net/dynamic-object-removal-for-diffusion-gen-videos-and-3dgs-recon/
        short_label: Paper
      - label: GitHub
        url: https://github.com/tharencandi/dynamic-object-removal-for-diffusion-gen-videos-and-3dgs-recon
    bullets:
      - long: "Studied why AI-generated video breaks 3D reconstruction: moving objects violate multi-view constraints and flickering textures make COLMAP (SfM) and 3D Gaussian Splatting drop frames, misestimate poses and collapse geometry"
        short: Evaluated fixes for AI-generated video that breaks 3D reconstruction (COLMAP + 3D Gaussian Splatting).
      - long: Compared dynamic object removal strategies against a raw baseline, from 2D masking and inpainting (YOLOv8 or SAM with ProPainter) to causal scene rewriting with the VOID video diffusion model
      - long: VOID cut LPIPS by about 57% on the car scene (0.169 to 0.073), while 2D masking and inpainting gave only marginal gains and introduced multi-view inconsistencies
        short: Cut LPIPS by 57% with VOID diffusion rewriting, where 2D masking and inpainting gave marginal gains.
      - long: Stabilised a static industrial-loft scene with CLAHE (for COLMAP) and bilateral filtering (for 3DGS training), recovering 3.9x more 3D points (2,342 to 9,158) and raising PSNR by 9.6 dB (25.1 to 34.7 dB)
        short: Stabilised a static scene with CLAHE and bilateral filtering, recovering 3.9x more 3D points (+9.6 dB PSNR).
      - long: Concluded that every post-hoc correction still introduces artifacts, so multi-view consistency needs 3D constraints during generation, such as explicit 3D memory
    tags: [Python, COLMAP, 3D Gaussian Splatting, YOLOv8, SAM, ProPainter, Video diffusion]

  - title: "Hard Real-Time Systems: Ada Ravenscar vs. Rust RTIC"
    short_title: "Hard Real-Time: Ada Ravenscar vs. Rust RTIC"
    show: [web, cv]
    subtitle: Master's Exam Project
    short_subtitle: ""
    date: Jan 2026 – Feb 2026
    links:
      - label: Project page
        url: https://tharencandi.net/rtic-ravenscar-mast-analysis/
        short_label: Paper
      - label: GitHub
        url: https://github.com/tharencandi/rtic-ravenscar-mast-analysis
    bullets:
      - long: Ported the Generic Environment Executive (GEE) hard real-time benchmark from Ada Ravenscar to Rust RTIC on an STM32F429I-Discovery (ARM Cortex-M4), preserving the original task set
        short: Ported a hard real-time benchmark from Ada Ravenscar to Rust RTIC on ARM Cortex-M4; modelled both in MAST.
      - long: Built MAST schedulability models for both frameworks, generated from templates with Python, using WCETs measured with the DWT cycle counter through GDB scripts
      - long: RTIC cut interrupt entry latency by about 45% (267 ns vs 483 ns) and scaled to 100 concurrent tasks with lower release jitter, while Ada ran out of memory after 25 extra tasks (20 KB default stacks)
        short: Measured RTIC cutting interrupt latency by 45% and scaling to 100 tasks, where Ada ran out of memory at 25.
      - long: Showed that RTIC's global interrupt masking adds non-preemptive blocking that rigorous schedulability analysis cannot ignore, and that its O(N) timer queue and separate synchronisation primitives make systems harder to model than Ada's protected objects
        short: Showed RTIC's global interrupt masking adds non-preemptive blocking that schedulability analysis must model.
      - long: At maximum load both frameworks reached about 64–65% utilisation, so their schedulability differences become negligible for millisecond-range deadlines
    tags: [Ada, Rust, RTIC, Ravenscar, ARM Cortex-M4, MAST, Python]

